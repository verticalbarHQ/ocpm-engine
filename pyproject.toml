[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "ocpm-engine"
version = "1.1.0"
description = "Standalone Rust-first object-centric process-mining engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Sol Eun" }]
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "COPYRIGHT.md",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_LICENSES.html",
]
dependencies = []

[project.urls]
Homepage = "https://vertical.bar"
Repository = "https://github.com/verticalbarHQ/ocpm-engine"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.maturin]
manifest-path = "crates/ocpm-python/Cargo.toml"
module-name = "ocpm_engine._native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
