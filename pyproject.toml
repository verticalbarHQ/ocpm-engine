[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ocpm-engine"
version = "0.3.0"
description = "Rust-first process-mining companion library for pg_ocpm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ocpm-engine contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
benchmark = ["psycopg2-binary>=2.9,<3"]

[tool.maturin]
manifest-path = "crates/ocpm-python/Cargo.toml"
module-name = "ocpm_engine._native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
