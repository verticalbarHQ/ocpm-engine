[package]
name = "rust4pm-ecosystem-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
process_mining = { git = "https://github.com/aarkue/rust4pm", rev = "b4c06f323fca55cf57eaf44ac25b46ea7c448cb4", features = ["ocel-sqlite"] }
# Kept explicit so the checked-in lock remains stable across Docker rebuilds;
# Rust4PM's OCEL SQLite feature uses the same crate transitively.
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
