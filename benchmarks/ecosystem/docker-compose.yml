name: ocpm-engine-ecosystem-benchmark

x-postgres-environment: &postgres-environment
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: pg

x-postgres-command: &postgres-command
  - postgres
  - -c
  - shared_buffers=1GB
  - -c
  - effective_cache_size=4GB
  - -c
  - work_mem=16MB
  - -c
  - maintenance_work_mem=1GB
  - -c
  - max_parallel_workers_per_gather=4
  - -c
  - random_page_cost=1.1
  - -c
  - jit=off

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  interval: 2s
  timeout: 3s
  retries: 60

x-benchmark-volumes: &benchmark-volumes
  - ../../.benchmarks:/results
  - ../../.benchmarks/ecosystem-data:/data
  - ../../.benchmarks/public-data:/sap-data:ro

services:
  postgres_vanilla:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment: *postgres-environment
    command: *postgres-command
    shm_size: 1gb
    healthcheck: *postgres-healthcheck
    volumes:
      - vanilla-data:/var/lib/postgresql/data

  postgres_ocpm:
    build:
      context: ${PG_OCPM_SOURCE}
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "16"
        POSTGRES_IMAGE: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        SOURCE_REVISION: ${OCPM_PG_OCPM_SOURCE_REVISION}
    environment: *postgres-environment
    command: *postgres-command
    shm_size: 1gb
    healthcheck: *postgres-healthcheck
    volumes:
      - ocpm-data:/var/lib/postgresql/data

  engine:
    build:
      context: ../..
      dockerfile: benchmarks/public/Dockerfile.client
      additional_contexts:
        engine_source: ../..
      args:
        CONTROLLER_REVISION: ${OCPM_ENGINE_SOURCE_REVISION}
        ENGINE_REVISION: ${OCPM_ENGINE_SOURCE_REVISION}
    depends_on:
      postgres_vanilla:
        condition: service_healthy
      postgres_ocpm:
        condition: service_healthy
    environment:
      OCPM_ENGINE_READ_PATH: auto
      OCPM_ENGINE_SOURCE_REVISION: ${OCPM_ENGINE_SOURCE_REVISION}
      OCPM_PG_OCPM_SOURCE_REVISION: ${OCPM_PG_OCPM_SOURCE_REVISION}
    volumes: *benchmark-volumes
    command: ["sleep", "infinity"]

  ocpa:
    build:
      context: ../..
      dockerfile: benchmarks/ecosystem/Dockerfile.ocpa
      args:
        CONTROLLER_REVISION: ${OCPM_ENGINE_SOURCE_REVISION}
    volumes: *benchmark-volumes
    command: ["sleep", "infinity"]

  rust4pm:
    build:
      context: ../..
      dockerfile: benchmarks/ecosystem/Dockerfile.rust4pm
      args:
        CONTROLLER_REVISION: ${OCPM_ENGINE_SOURCE_REVISION}
        RUST4PM_REVISION: b4c06f323fca55cf57eaf44ac25b46ea7c448cb4
    volumes: *benchmark-volumes
    command: ["sleep", "infinity"]

volumes:
  vanilla-data:
  ocpm-data:
