site_name: ocpm-engine
site_description: Standalone Rust-first object-centric process-mining engine
site_url: https://verticalbarhq.github.io/ocpm-engine/
repo_url: https://github.com/verticalbarHQ/ocpm-engine
repo_name: verticalbarHQ/ocpm-engine
copyright: Copyright 2026 Vertical Bar, Inc. Licensed under Apache-2.0.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  results/
  open-source-patent-icpm-assessment.md
  prior-art-and-icpm-roadmap.md
  ocpm-mcp-feasibility.md
  open-source-release.md
  private-distribution.md
  process-mining-capability-map.md
  sap-pm4py-three-way-performance.md
  rust4pm-vs-pg-ocpm-engine.md
  ocpa-vs-pg-ocpm-engine.md
  public-common-pm-performance.md
  ocpm-engine-0.9-full-benchmark.md
  ocpm-engine-0.9-performance.md
  ocpq-0.9-four-way-comparison.md

nav:
  - Start:
      - Overview: index.md
      - Installation: https://github.com/verticalbarHQ/ocpm-engine/blob/main/INSTALL.md
      - Quickstart: getting-started.md
  - Modules:
      - Overview: api-reference.md
      - Bottleneck analysis: bottleneck-analysis.md
      - standalone: modules/standalone.md
      - engine: modules/engine.md
      - analytics: modules/analytics.md
      - event_batches: modules/event_batches.md
      - bindings: modules/bindings.md
      - models: modules/models.md
      - queries: modules/queries.md
      - dynamic_queries: modules/dynamic_queries.md
  - Architecture:
      - Engine specification (1.0.0): ocpm-engine-1.0.0-spec.md
      - DuckDB Parquet provider: duckdb-parquet-provider-spec.md
      - pg_ocpm aggregation pushdown: pg-ocpm-0.10-general-aggregation.md
      - Query performance architecture: technical-performance-improvements.md
  - Benchmarks:
      - OCPQ strict result (1.0): ocpq-performance.md
      - OCPQ four-way comparison (1.0): ocpq-1.0-four-way-comparison.md
      - SAP O2C/P2P four-way with DuckDB (1.1): duckdb-sap-pm4py-four-way-performance.md
      - Rust4PM comparison (1.1): duckdb-vs-rust4pm-performance.md
      - OCPA comparison (1.1): duckdb-vs-ocpa-performance.md
  - Resources:
      - Release notes (1.0.0): ocpm-engine-1.0.0-release-notes.md
      - Academic implementation provenance: academic-implementation-provenance.md
      - Production dependency boundary: dependency-boundary.md
      - Community distribution: community-distribution.md
