[package]
name = "ocpm-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Standalone object-centric process-mining engine and provider facade"
publish = false

[features]
default = []
postgres = ["dep:ocpm-postgres"]

[dependencies]
ocpm-conformance.workspace = true
ocpm-core.workspace = true
ocpm-discovery.workspace = true
ocpm-enhancement.workspace = true
ocpm-io = { path = "../ocpm-io", version = "1.0.0" }
ocpm-local.workspace = true
ocpm-prediction.workspace = true
ocpm-provider.workspace = true
ocpm-postgres = { workspace = true, optional = true }
ocpm-query.workspace = true
serde_json.workspace = true
