[package]
name = "ocpm-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone object-centric process-mining engine and provider facade"
publish = false

[features]
default = []
postgres = ["dep:ocpm-postgres"]
duckdb = ["dep:ocpm-duckdb"]
duckdb-s3 = ["duckdb", "ocpm-duckdb/s3"]
gnn = ["dep:ocpm-gnn"]

[dependencies]
ocpm-conformance.workspace = true
ocpm-core.workspace = true
ocpm-discovery.workspace = true
ocpm-enhancement.workspace = true
ocpm-bottleneck.workspace = true
ocpm-io = { path = "../ocpm-io", version = "1.1.0" }
ocpm-local.workspace = true
ocpm-duckdb = { workspace = true, optional = true }
ocpm-prediction.workspace = true
ocpm-gnn = { workspace = true, optional = true }
ocpm-provider.workspace = true
ocpm-postgres = { workspace = true, optional = true }
ocpm-query.workspace = true
serde.workspace = true
serde_json.workspace = true
