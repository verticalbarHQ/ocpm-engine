[package]
name = "ocpm-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Asynchronous pg_ocpm adapter for ocpm-engine"
publish = false

[dependencies]
ocpm-core.workspace = true
thiserror.workspace = true
tokio-postgres = "0.7.18"

[dev-dependencies]
serde.workspace = true
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "sync"] }

[[example]]
name = "ocpq_candidate_benchmark"
path = "../../benchmarks/ocpq/strict_candidate_benchmark.rs"
