name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Rust MSRV
        run: >-
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          --component rustfmt --component clippy
      - name: Provision external DuckDB client
        env:
          DUCKDB_VERSION: 1.5.5
          DUCKDB_AMD64_SHA256: 1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb
        run: |
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          echo "${DUCKDB_AMD64_SHA256}  /tmp/libduckdb.zip" | sha256sum --check --strict
          unzip -q /tmp/libduckdb.zip libduckdb.so duckdb.h -d /tmp/libduckdb
          sudo install -m 0644 /tmp/libduckdb/libduckdb.so /usr/local/lib/libduckdb.so
          sudo install -m 0644 /tmp/libduckdb/duckdb.h /usr/local/include/duckdb.h
          sudo ldconfig
      - name: Check release notes
        run: python scripts/check-release-notes.py
      - name: Test Rust workspace
        run: cargo +1.85.1 test --workspace --all-targets --locked
      - name: Check Rust formatting
        run: cargo +1.85.1 fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.85.1"
          command: check
          arguments: --all-features
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
